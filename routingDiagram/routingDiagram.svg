<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#141414; font-family:'Inter', sans-serif;">
  <defs>
    <linearGradient id="netflixRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#b80610" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242424" />
      <stop offset="100%" stop-color="#181818" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="45" fill="#e50914" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="2">NETFLIX CLONE ROUTING ARCHITECTURE</text>
  <text x="500" y="70" fill="#8c8c8c" font-size="13" text-anchor="middle">React Router v7 / Component Hierarchy &amp; State Management</text>

  <!-- Root App Provider -->
  <rect x="350" y="95" width="300" height="55" rx="8" fill="url(#netflixRed)" filter="url(#glow)"/>
  <text x="500" y="120" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">App.jsx (Root)</text>
  <text x="500" y="138" fill="#ffebee" font-size="11" text-anchor="middle">&lt;MovieProvider&gt; State &amp; Modals Context</text>

  <!-- Layout Component -->
  <rect x="320" y="180" width="360" height="85" rx="8" fill="url(#cardGrad)" stroke="#e50914" stroke-width="1.5" filter="url(#glow)"/>
  <text x="500" y="205" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Layout Component ("/")</text>
  <text x="500" y="225" fill="#a3a3a3" font-size="12" text-anchor="middle">Header (Nav, Search, Notifs, Profile)</text>
  <text x="500" y="243" fill="#a3a3a3" font-size="11" text-anchor="middle">Modals (TrailerModal, DetailModal, Toast) + &lt;Outlet /&gt; + Footer</text>

  <!-- Connecting line from Root to Layout -->
  <line x1="500" y1="150" x2="500" y2="180" stroke="#e50914" stroke-width="2" stroke-dasharray="4"/>

  <!-- Routes Branching Lines -->
  <path d="M 500 265 L 500 295 M 80 295 L 920 295" stroke="#404040" stroke-width="2"/>
  
  <line x1="80" y1="295" x2="80" y2="330" stroke="#404040" stroke-width="2"/>
  <line x1="220" y1="295" x2="220" y2="330" stroke="#404040" stroke-width="2"/>
  <line x1="360" y1="295" x2="360" y2="330" stroke="#404040" stroke-width="2"/>
  <line x1="500" y1="295" x2="500" y2="330" stroke="#404040" stroke-width="2"/>
  <line x1="640" y1="295" x2="640" y2="330" stroke="#404040" stroke-width="2"/>
  <line x1="780" y1="295" x2="780" y2="330" stroke="#404040" stroke-width="2"/>
  <line x1="920" y1="295" x2="920" y2="330" stroke="#404040" stroke-width="2"/>

  <!-- 1. Home Route -->
  <rect x="20" y="330" width="120" height="90" rx="6" fill="#1e1e1e" stroke="#333" filter="url(#glow)"/>
  <text x="80" y="355" fill="#e50914" font-size="13" font-weight="700" text-anchor="middle">Home</text>
  <text x="80" y="375" fill="#888" font-size="10" text-anchor="middle">Path: "/"</text>
  <text x="80" y="395" fill="#bbb" font-size="9" text-anchor="middle">Banner</text>
  <text x="80" y="408" fill="#bbb" font-size="9" text-anchor="middle">DisplayRow (10)</text>

  <!-- 2. TV Shows -->
  <rect x="160" y="330" width="120" height="90" rx="6" fill="#1e1e1e" stroke="#333" filter="url(#glow)"/>
  <text x="220" y="355" fill="#e50914" font-size="13" font-weight="700" text-anchor="middle">TvShows</text>
  <text x="220" y="375" fill="#888" font-size="10" text-anchor="middle">Path: "/tv-shows"</text>
  <text x="220" y="395" fill="#bbb" font-size="9" text-anchor="middle">TV Banner</text>
  <text x="220" y="408" fill="#bbb" font-size="9" text-anchor="middle">Genre Filter</text>

  <!-- 3. Movies -->
  <rect x="300" y="330" width="120" height="90" rx="6" fill="#1e1e1e" stroke="#333" filter="url(#glow)"/>
  <text x="360" y="355" fill="#e50914" font-size="13" font-weight="700" text-anchor="middle">Movies</text>
  <text x="360" y="375" fill="#888" font-size="10" text-anchor="middle">Path: "/movies"</text>
  <text x="360" y="395" fill="#bbb" font-size="9" text-anchor="middle">Film Banner</text>
  <text x="360" y="408" fill="#bbb" font-size="9" text-anchor="middle">Blockbusters</text>

  <!-- 4. News & Popular -->
  <rect x="440" y="330" width="120" height="90" rx="6" fill="#1e1e1e" stroke="#333" filter="url(#glow)"/>
  <text x="500" y="350" fill="#e50914" font-size="12" font-weight="700" text-anchor="middle">News &amp; Pop</text>
  <text x="500" y="370" fill="#888" font-size="9" text-anchor="middle">/news-and-popular</text>
  <text x="500" y="390" fill="#bbb" font-size="9" text-anchor="middle">Top 10 Today</text>
  <text x="500" y="405" fill="#bbb" font-size="9" text-anchor="middle">Worth The Wait</text>

  <!-- 5. My List -->
  <rect x="580" y="330" width="120" height="90" rx="6" fill="#1e1e1e" stroke="#333" filter="url(#glow)"/>
  <text x="640" y="355" fill="#e50914" font-size="13" font-weight="700" text-anchor="middle">MyList</text>
  <text x="640" y="375" fill="#888" font-size="10" text-anchor="middle">Path: "/my-list"</text>
  <text x="640" y="395" fill="#bbb" font-size="9" text-anchor="middle">LocalStorage Sync</text>
  <text x="640" y="408" fill="#bbb" font-size="9" text-anchor="middle">Filter &amp; Sort Grid</text>

  <!-- 6. Browse by Language -->
  <rect x="720" y="330" width="120" height="90" rx="6" fill="#1e1e1e" stroke="#333" filter="url(#glow)"/>
  <text x="780" y="350" fill="#e50914" font-size="11" font-weight="700" text-anchor="middle">By Language</text>
  <text x="780" y="370" fill="#888" font-size="9" text-anchor="middle">/browse-by-language</text>
  <text x="780" y="390" fill="#bbb" font-size="9" text-anchor="middle">Multi-Language</text>
  <text x="780" y="405" fill="#bbb" font-size="9" text-anchor="middle">Dubbing &amp; Subs</text>

  <!-- 7. Not Found (404) -->
  <rect x="860" y="330" width="120" height="90" rx="6" fill="#1e1e1e" stroke="#333" filter="url(#glow)"/>
  <text x="920" y="355" fill="#e50914" font-size="13" font-weight="700" text-anchor="middle">NotFound</text>
  <text x="920" y="375" fill="#888" font-size="10" text-anchor="middle">Path: "*"</text>
  <text x="920" y="395" fill="#bbb" font-size="9" text-anchor="middle">NSES-404 Error</text>
  <text x="920" y="408" fill="#bbb" font-size="9" text-anchor="middle">Home Redirect</text>

  <!-- Reusable Components Box -->
  <rect x="40" y="465" width="440" height="150" rx="8" fill="url(#cardGrad)" stroke="#333" filter="url(#glow)"/>
  <text x="260" y="495" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Core Reusable Components</text>
  <text x="60" y="525" fill="#e50914" font-size="12" font-weight="600">• Banner.jsx</text>
  <text x="160" y="525" fill="#aaa" font-size="12">- Hero preview, Trailer trigger, Details trigger</text>
  <text x="60" y="550" fill="#e50914" font-size="12" font-weight="600">• SlideShow.jsx</text>
  <text x="175" y="550" fill="#aaa" font-size="12">- Swiper carousel with Top 10 rank badges</text>
  <text x="60" y="575" fill="#e50914" font-size="12" font-weight="600">• MovieCard.jsx</text>
  <text x="175" y="575" fill="#aaa" font-size="12">- Hover preview, Play trailer, My List toggle</text>
  <text x="60" y="600" fill="#e50914" font-size="12" font-weight="600">• DisplayRow.jsx</text>
  <text x="185" y="600" fill="#aaa" font-size="12">- Multi-category TMDB &amp; fallback rows</text>

  <!-- Modals & Utilities Box -->
  <rect x="520" y="465" width="440" height="150" rx="8" fill="url(#cardGrad)" stroke="#333" filter="url(#glow)"/>
  <text x="740" y="495" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Modals &amp; Utility Modules</text>
  <text x="540" y="525" fill="#e50914" font-size="12" font-weight="600">• TrailerModal.jsx</text>
  <text x="660" y="525" fill="#aaa" font-size="12">- Live YouTube trailer embed player</text>
  <text x="540" y="550" fill="#e50914" font-size="12" font-weight="600">• DetailModal.jsx</text>
  <text x="655" y="550" fill="#aaa" font-size="12">- Full synopsis, cast, match score &amp; similar</text>
  <text x="540" y="575" fill="#e50914" font-size="12" font-weight="600">• MovieInstance.js</text>
  <text x="670" y="575" fill="#aaa" font-size="12">- Axios TMDB base client instance</text>
  <text x="540" y="600" fill="#e50914" font-size="12" font-weight="600">• requestUrls.js</text>
  <text x="655" y="600" fill="#aaa" font-size="12">- Dynamic TMDB endpoints &amp; API key config</text>
</svg>
